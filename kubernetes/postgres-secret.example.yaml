apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: edgefleet
  POSTGRES_PASSWORD: REPLACE_WITH_LOCAL_PASSWORD
  POSTGRES_DB: edgefleet
  DATABASE_URL: postgresql+psycopg://edgefleet:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres-service:5432/edgefleet
